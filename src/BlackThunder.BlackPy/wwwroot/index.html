<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>BlackPy · 나의 코드 무대</title>
    <link rel="stylesheet" href="app.css">
    <script src="scene.js" defer></script>
    <script src="input.js" defer></script>
    <script src="palette.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <main class="playground">
        <header class="page-header">
            <div class="heading-group">
                <span class="brand-mark" aria-hidden="true">B<span>py</span></span>
                <div><h1>BlackPy</h1><p class="page-intro">코드를 쓰고, 나만의 이야기를 움직여요.</p></div>
            </div>
            <p id="connection-status" class="connection-status" role="status" aria-live="polite">
                <span class="connection-dot" aria-hidden="true"></span><span id="connection-label">연결 중</span>
            </p>
        </header>
        <section class="controls" aria-label="코드 실행">
            <button id="start-button" class="button button-primary" type="button" disabled>▶ 시작</button>
            <button id="stop-button" class="button button-stop" type="button" disabled>■ 중지</button>
            <button id="restart-button" class="button button-secondary" type="button" disabled>↻ 다시 시작</button>
            <p id="run-status" class="run-status" role="status" aria-live="polite">준비 중이에요</p>
        </section>
        <div id="notice" class="notice" role="alert" hidden></div>
        <div class="workspace">
            <div class="stage-column">
                <section class="panel stage-panel" aria-labelledby="stage-title">
                    <div class="panel-heading">
                        <h2 id="stage-title">우리들의 무대</h2><span class="stage-size">800 × 600</span>
                    </div>
                    <div class="stage-surface">
                        <canvas id="stage" width="800" height="600" role="application" tabindex="0"
                                aria-label="캐릭터를 움직이는 무대. 가운데가 원점이고 오른쪽과 위쪽이 양수입니다."
                                aria-describedby="input-hint scene-message position-report">
                            Python 출력과 오류는 무대 아래 로그에서 확인해요.
                        </canvas>
                    </div>
                    <p id="input-hint" class="input-hint">시작한 뒤 무대를 눌러요.</p>
                    <p id="scene-message" class="scene-message" role="status" aria-live="polite" hidden></p>
                    <p id="position-report" class="position-report" hidden>
                        <span>x <strong id="position-x">0</strong></span>
                        <span>y <strong id="position-y">0</strong></span>
                        <span>방향 <strong id="position-heading">0°</strong></span>
                    </p>
                </section>
                <section class="panel output-panel" aria-labelledby="output-title">
                    <div class="panel-heading"><h2 id="output-title">로그</h2><span class="output-icon">&gt;_</span></div>
                    <div class="console-area" tabindex="0" role="region" aria-label="Python 출력과 오류">
                        <p id="output-placeholder" class="output-placeholder">
                            <code>print()</code>로 쓴 말과 오류가 여기에 나와요.
                        </p>
                        <div id="output-lines"></div>
                    </div>
                </section>
            </div>
            <aside class="panel palette-panel" aria-labelledby="palette-title">
                <div class="palette-heading">
                    <div><span class="eyebrow">PYTHON TOOLBOX</span><h2 id="palette-title">블록 모음</h2></div>
                    <span class="copy-badge">클릭해서 복사</span>
                </div>
                <div class="target-picker">
                    <label for="target-select">누구의 코드를 쓸까요?</label>
                    <select id="target-select" disabled><option>프로젝트를 읽고 있어요</option></select>
                    <p>VS Code에서 <code id="target-file">…</code>에 붙여넣어요.</p>
                </div>
                <div class="palette-workspace">
                    <nav id="categories" class="categories" aria-label="명령 종류"></nav>
                    <div class="card-area">
                        <p id="category-description" class="category-description"></p>
                        <div id="command-cards"></div>
                    </div>
                </div>
                <p id="copy-status" class="copy-status" role="status" aria-live="polite">
                    코드 줄을 누르면 복사돼요.
                </p>
            </aside>
        </div>
    </main>
</body>
</html>
